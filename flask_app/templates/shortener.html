{% extends "_base.html" %}

{% block content %}
<div class="shortener">
  <h3>Da se mi da URL</h3>
  <form class="box">
    <div class="row">
      <input type="url" class="url-input" required autofocus />
      <button class="btn-shorten">
        <span>Pošortnaj</span>
        <img
          src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%2231.957%2035.93%2066.358%2055.2%22%3E%0A%20%20%3Cpath%20d%3D%22m68.357%2040.73%2019.7%2019.8h-53.1a3%203%200%200%200%200%206h53.1l-19.7%2019.8a3%203%200%200%200%204.2%204.2l24.9-24.9a3%203%200%200%200%200-4.2l-24.9-24.9a3%203%200%200%200-4.2%204.2z%22%2F%3E%0A%3C%2Fsvg%3E%0A"
          alt=""
        />
      </button>
    </div>
    <div class="row alias-row">
      <label class="checkbox-label" for="is-custom-alias">
        <input type="checkbox" name="is-custom-alias" id="is-custom-alias" />
        <span>Hočem poljubni alias</span>
      </label>
      <input type="text" class="alias-input" style="display: none" disabled />
    </div>
  </form>
</div>

<script type="module">
  const form = document.querySelector(".box");
  const urlInput = form.querySelector(".url-input");
  const shortenButton = form.querySelector(".btn-shorten");
  const aliasInput = form.querySelector(".alias-input");
  const aliasCheckbox = form.querySelector("#is-custom-alias");

  let state = null;

  function toggleAliasInput(isChecked) {
    if (isChecked) {
      aliasInput.style.display = "block";
      aliasInput.disabled = false;
      aliasInput.required = true;
      aliasInput.focus();
    } else {
      aliasInput.value = "";
      aliasInput.style.display = "none";
      aliasInput.disabled = true;
      aliasInput.required = false;
      aliasInput.setCustomValidity("");
    }
  }

  aliasCheckbox.addEventListener("change", (event) => {
    toggleAliasInput(event.target.checked);
  });
  toggleAliasInput(aliasCheckbox.checked);

  function checkAliasValidity() {
    const alias = aliasInput.value;

    if (alias.length < 3) {
      aliasInput.setCustomValidity("Alias mora biti dolg vsaj 3 znake.");
      aliasInput.reportValidity();
      return false;
    }

    if (alias.length > 30) {
      aliasInput.setCustomValidity("Alias ne sme biti daljši od 30 znakov.");
      aliasInput.reportValidity();
      return false;
    }

    if (!/^[a-z0-9-]+$/.test(alias)) {
      aliasInput.setCustomValidity(
        "Alias lahko vsebuje samo male črke, številke in vezaje."
      );
      aliasInput.reportValidity();
      return false;
    }

    if (/\-\-/.test(alias)) {
      aliasInput.setCustomValidity(
        "Alias ne sme vsebovati zaporednih vezajev."
      );
      aliasInput.reportValidity();
      return false;
    }

    if (!/^[a-z]/i.test(alias)) {
      aliasInput.setCustomValidity("Alias se mora začeti z malo črko.");
      aliasInput.reportValidity();
      return false;
    }

    if (!/[a-z0-9]$/.test(alias)) {
      aliasInput.setCustomValidity(
        "Alias se mora končati z malo črko ali številko."
      );
      aliasInput.reportValidity();
      return false;
    }

    aliasInput.setCustomValidity("");
    return true;
  }

  aliasInput.addEventListener("input", () => {
    if (aliasCheckbox.checked) {
      checkAliasValidity();
    }
  });

  function alertErrors(data) {
    let str = "Napaka: ";
    try {
      str += JSON.stringify(data, null, 2);
    } catch (e) {
      str += String(data);
    }
    alert(str);
  }

  async function postDataToServer(data = {}) {
    const response = await fetch("/_shorten_link", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data),
    });
    return [response.ok, await response.json()];
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    if (state === "loading") {
      return;
    }

    if (state === "success") {
      urlInput.value = "";
      shortenButton.querySelector("span").textContent = "Pošortnaj";
      state = null;
      return;
    }

    if (aliasCheckbox.checked && !checkAliasValidity()) {
      return;
    }

    shortenButton.disabled = true;
    state = "loading";

    const [ok, data] = await postDataToServer({
      destination: urlInput.value,
      alias: aliasCheckbox.checked ? aliasInput.value : undefined,
    });

    if (ok) {
      const { protocol, hostname } = new URL(window.location);
      const shortenedURL = `${protocol}//${hostname}/${data.alias}`;
      urlInput.value = shortenedURL;
      urlInput.select();
      document.execCommand("copy");

      state = "success";
      shortenButton.querySelector("span").textContent = "Resetiraj";
      shortenButton.disabled = false;
    } else {
      urlInput.value = "";
      console.error("Error!", data);

      state = "error";
      shortenButton.querySelector("span").textContent = "Napaka :(";

      alertErrors(data);
    }
  });
</script>
{% endblock %}
