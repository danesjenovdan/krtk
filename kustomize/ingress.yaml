apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: krtk
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - djnd.si
      secretName: krtk-tls
  rules:
    - host: djnd.si
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: krtk
                port:
                  number: 8000
