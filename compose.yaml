volumes:
  postgres-data:


services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    environment:
      POSTGRES_DB: krtk
      POSTGRES_USER: krtk
      POSTGRES_PASSWORD: changeme

  krtk:
    build: ./flask_app
    command: flask run --debug --port=8000 --host=0.0.0.0
    volumes:
      - ./flask_app:/app:delegated,rw
    ports:
      - "8000:8000"
    environment:
      FLASK_DATABASE_HOST: db
      FLASK_DATABASE_NAME: krtk
      FLASK_DATABASE_USERNAME: krtk
      FLASK_DATABASE_PASSWORD: changeme
    depends_on:
      - db
